baseURL = 'https://nek0c7.pages.dev/'   # Hoặc domain cá nhân của mày nếu có
languageCode = 'en-us'
title = "nek0c7's Notes"
theme = 'PaperMod'

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[params]
  env = 'production'
  googleSiteVerification = "eKXmdrJSa6E5uaHn7aMsFHw64Qkg2pnp1ATirc7eCgQ"
  author = "nek0c7"
  description = "The little things in the life of a lonely man who loves to write code"
  keywords = ["blog", "tech", "linux", "programming"]
  images = ["images/og-cover.png"]
  # Canonical & SEO
  ShowFullTextInRSS = false
  enableRobotsTXT = true     # Tự động tạo file robots.txt khi build
  ShowBreadCrumbs = true     # Hiện Breadcrumb (Google rất thích cái này)
  defaultTheme = "dark"                   # Mặc định bật Dark Mode bao ngầu
  ShowCodeCopyButtons = true             # Hiện nút Copy góc phải ở mọi code block

[params.homeInfoParams]
  Title = "Welcome to my little corner!"
  Content = "Here, you’ll find everything from personal musings and occasional rants to in-depth tutorials and long-form series centered around my various projects"

